name: chromehearts-monitor

on:
  schedule:
    # 每 10 分钟一次（GitHub 高峰期可能延迟，实际间隔可能到 10-20 分钟）
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: chromehearts-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run store monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          STATE_PATH: state/store_seen.json
        run: python store_monitor.py

      - name: Persist state
        run: |
          git add -A state/
          if git diff --cached --quiet; then
            echo "状态无变化，无需提交。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "update store state"
            git push
          fi
